name: 🚀 Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD
  # ─────────────────────────────────────────────
  build:
    name: Build Laravel App
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────
      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, curl, zip, sqlite3
          coverage: none

      - name: 📝 Create SQLite database (for composer)
        working-directory: website
        run: touch database/database.sqlite

      - name: 📦 Install Composer dependencies
        working-directory: website
        env:
          APP_ENV: testing
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ── Node / Assets ─────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: 📦 Install NPM dependencies
        working-directory: website
        run: npm ci

      - name: 🏗️ Build frontend assets
        working-directory: website
        run: npm run build

  # ─────────────────────────────────────────────
  # 2. DEPLOY VIA FTP
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to cPanel Server via FTP
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # The deploy action happily "succeeds" while transferring nothing if
      # the password is missing — fail loudly instead.
      - name: 🚫 Require FTP credentials
        run: |
          if [ -z "${{ secrets.FTP_PASSWORD || secrets.FORUS_FTP_PASSWORD }}" ]; then
            echo "::error::Set FTP_PASSWORD (or FORUS_FTP_PASSWORD) in GitHub Actions secrets."
            exit 1
          fi

      # ── Install dependencies (on runner, not server) ──
      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, curl, zip, sqlite3

      - name: 📝 Create SQLite database (for composer)
        working-directory: website
        run: touch database/database.sqlite

      - name: 📦 Install Composer dependencies
        working-directory: website
        env:
          APP_ENV: testing
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: 📦 Install NPM dependencies
        working-directory: website
        run: npm ci

      - name: 🏗️ Build frontend assets
        working-directory: website
        run: npm run build

      # ── Prepare website for FTP upload ────────
      - name: 🗑️ Clean up website before FTP upload
        run: |
          cd website
          rm -rf node_modules
          rm -rf vendor/.git
          rm -rf bootstrap/cache/*
          find . -name '.DS_Store' -delete
          cd ..

      # Only the website/ folder contents go to /public_html.
      # Use lftp directly so the transfer has retries, passive mode, parallel
      # transfers, and a bounded timeout. The previous third-party action
      # could remain running without reporting progress.
      - name: 📡 Upload website to FTP
        timeout-minutes: 20
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || '157.20.105.138' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'forusfreight' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.FORUS_FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH || '.' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" -e "
            set ftp:passive-mode true;
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror --reverse --continue --parallel=4 --verbose \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob '.git/*' \
              --exclude-glob 'node_modules/*' \
              --exclude-glob 'vendor/*' \
              --exclude-glob 'storage/logs/*' \
              --exclude-glob 'storage/framework/cache/*' \
              --exclude-glob 'storage/framework/sessions/*' \
              --exclude-glob 'storage/framework/views/*' \
              --exclude-glob database/database.sqlite \
              ./website/ \"$FTP_REMOTE_PATH\";
            quit"

      # ── Run Laravel post-deployment tasks via PHP ─────
      # Note: For FTP deployments, you may need to:
      # 1. Setup a post-deploy webhook/script on the server
      # 2. Or use a separate SSH step to run artisan commands
      # 3. Or setup a cron job that runs migrations on startup

      - name: ℹ️ Deployment Info
        run: |
          echo "✅ Website folder deployed to cPanel FTP!"
          echo ""
          echo "📂 Deployment Summary:"
          echo "  ✅ Website folder → FTP → /public_html (cPanel)"
          echo "  ⏳ Ecommerce folder → Docker → VM (deploy-vm job)"
          echo ""
          echo "⚠️  Manual post-deployment steps (run via SSH):"
          echo "1. SSH: ssh update9240@forusfl.co.zm"
          echo "2. Navigate: cd /public_html"
          echo "3. Run migrations: php artisan migrate --force"
          echo "4. Clear cache: php artisan cache:clear && php artisan view:clear && php artisan config:clear"
          echo "5. Restart queue: sudo supervisorctl restart forusfreight-queue:*"

      - name: 🎉 Notify success
        if: success()
        run: echo "✅ FTP Deployment to cPanel succeeded on $(date)."

      - name: ❌ Notify failure
        if: failure()
        run: echo "❌ FTP Deployment FAILED. Check the logs above."

  # ─────────────────────────────────────────────
  # 3. DEPLOY ECOMMERCE API + ADMIN PORTAL TO VM
  # ─────────────────────────────────────────────
  deploy-vm:
    name: Deploy Forus Digital to VM
    if: ${{ vars.DEPLOY_VM == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🚫 Require VM FTP credentials
        run: |
          if [ -z "${{ secrets.VM_FTP_PASSWORD }}" ]; then
            echo "::error::VM_FTP_PASSWORD secret is missing (Settings → Secrets → Actions). The upload would be a silent no-op."
            exit 1
          fi

      - name: 📡 Upload to VM via FTP (Ecommerce)
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: ftp
          remote-host: ${{ secrets.VM_FTP_SERVER }}
          remote-port: 21
          remote-user: ${{ secrets.VM_FTP_USERNAME }}
          remote-password: ${{ secrets.VM_FTP_PASSWORD }}
          local-path: ./Ecommerce/
          remote-path: ${{ secrets.VM_FTP_REMOTE_PATH || '.' }}
          sync: full

      - name: 🎉 Notify VM deployment success
        if: success()
        run: echo "✅ Ecommerce FTP deployment to VM succeeded on $(date)."

      - name: ❌ Notify VM deployment failure
        if: failure()
        run: echo "❌ Ecommerce FTP deployment FAILED. Check the logs above."
